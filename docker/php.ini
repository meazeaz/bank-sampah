upload_max_filesize=32M
post_max_size=32M
memory_limit=512M

; OPcache: wajib di sini karena tiap stat file di bind mount Windows ~20ms.
; validate_timestamps=1 tetap dipertahankan supaya perubahan kode di app/,
; routes/, resources/ langsung terbaca tanpa restart container.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
